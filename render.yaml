services:
  - type: web
    name: lynx-fabula
    runtime: static
    buildCommand: echo "Static extension — no build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: https://www.owlbear.rodeo
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
